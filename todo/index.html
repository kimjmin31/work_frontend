<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO 리스트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/todo.js"></script>
</head>
<body>
  <!-- 헤더 -->
  <header class="header px-5 py-3">
    <h1 id="formTitle" class="font-semibold">To do List</h1>
  </header>

  <main class="mx-auto max-w-3xl p-5">
    <!-- 입력 폼 -->
    <form name="todoForm" class="mb-8 flex flex-col gap-3">
      <label class="row"><span>날짜</span><input type="date" name="date" class="field" /></label>
      <label class="row"><span>제목</span><input type="text" name="subject" class="field" placeholder="제목 입력" /></label>
      <label class="row"><span>내용</span><textarea name="content" class="field" placeholder="내용 입력"></textarea></label>
      <div class="mt-2 flex justify-center gap-2">
        <button id="submitBtn" class="btn w-1/2 bg-blue-500">등록하기</button>
        <button type="button" id="cancelBtn" class="btn w-1/4 bg-slate-400">취소</button>
      </div>
    </form>

    <!-- 현황 -->
    <p id="statsText" class="mb-3 text-sm text-slate-500"></p>

    <!-- 할일 목록 -->
    <section id="todoList" class="grid gap-5 md:grid-cols-2"></section>
  </main>
</body>
</html>
